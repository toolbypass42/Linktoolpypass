<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Discord</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: #000;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255, 20, 147, 0.25), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(255, 20, 147, 0.18), transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: linear-gradient(160deg, #1a0010 0%, #0a0005 100%);
    border: 2px solid #ff1493;
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    box-shadow:
      0 0 30px rgba(255, 20, 147, 0.6),
      0 0 60px rgba(255, 20, 147, 0.3),
      inset 0 0 30px rgba(255, 20, 147, 0.1);
    animation: glow 2.5s ease-in-out infinite alternate;
    z-index: 2;
  }

  @keyframes glow {
    from {
      box-shadow:
        0 0 25px rgba(255, 20, 147, 0.5),
        0 0 50px rgba(255, 20, 147, 0.2),
        inset 0 0 25px rgba(255, 20, 147, 0.1);
    }
    to {
      box-shadow:
        0 0 45px rgba(255, 20, 147, 0.9),
        0 0 90px rgba(255, 20, 147, 0.5),
        inset 0 0 40px rgba(255, 20, 147, 0.2);
    }
  }

  .icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: #000;
    border: 2px solid #ff1493;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(255, 20, 147, 0.7);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .icon svg {
    width: 45px;
    height: 45px;
    fill: #ff1493;
    filter: drop-shadow(0 0 6px #ff1493);
  }

  h1 {
    font-size: 26px;
    margin-bottom: 10px;
    color: #ff1493;
    text-shadow: 0 0 10px rgba(255, 20, 147, 0.9), 0 0 25px rgba(255, 20, 147, 0.6);
    letter-spacing: 1px;
  }

  p.subtitle {
    font-size: 14px;
    color: #ffb3d9;
    margin-bottom: 30px;
    opacity: 0.9;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 16px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .btn-main {
    background: linear-gradient(90deg, #ff1493, #ff4fa8);
    color: #000;
    box-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
    border: 2px solid #ff1493;
  }

  .btn-main::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    transition: left 0.5s ease;
  }

  .btn-main:hover::before {
    left: 100%;
  }

  .btn-main:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 35px rgba(255, 20, 147, 1), 0 0 60px rgba(255, 20, 147, 0.5);
  }

  .btn-backup {
    background: transparent;
    color: #ff1493;
    border: 2px solid #ff1493;
    box-shadow: inset 0 0 15px rgba(255, 20, 147, 0.2);
  }

  .btn-backup:hover {
    background: rgba(255, 20, 147, 0.15);
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 25px rgba(255, 20, 147, 0.8);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    z-index: 1;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: blink 1.5s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .note {
    margin-top: 20px;
    font-size: 12px;
    color: #ffb3d9;
    opacity: 0.7;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
    color: #ff1493;
    font-size: 12px;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #ff1493, transparent);
  }

  /* Floating particles */
  .particle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: #ff1493;
    border-radius: 50%;
    box-shadow: 0 0 10px #ff1493;
    pointer-events: none;
    animation: floatUp linear infinite;
    z-index: 1;
  }

  @keyframes floatUp {
    from {
      transform: translateY(100vh) scale(0);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to {
      transform: translateY(-100vh) scale(1);
      opacity: 0;
    }
  }
</style>
</head>
